# NGINX Reverse Proxy Configuration
# Replace "flightiq.pro" with your actual domain.
# Place at /etc/nginx/sites-available/flightiq and symlink to sites-enabled.
# Obtain TLS certs with: sudo certbot --nginx -d flightiq.pro

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name flightiq.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flightiq.pro;

    # --- TLS (Certbot will fill these in) ---
    ssl_certificate     /etc/letsencrypt/live/flightiq.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flightiq.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Go backend: /api/* ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for large telemetry uploads
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }

    # --- Next.js: everything else ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / keep-alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/protobuf;
    gzip_min_length 256;
}
