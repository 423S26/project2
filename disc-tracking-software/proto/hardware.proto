syntax = "proto3";

package disctracking;

option go_package = "project2/disc-tracking-software/pb";

// ============ HARDWARE/TELEMETRY MESSAGES ============
// Field numbers MUST match firmware tracker.proto (nanopb)

message Ping {
  string device_id = 1;

  // Spatial (GPS)
  double lat = 2;
  double lon = 3;
  double alt = 4;

  // Velocity & Environment
  float speed_mps = 5;
  float heading = 6;
  float temp_c = 7;

  // Signal Quality
  float hdop = 8;
  int32 sats = 9;

  // Physics: Accelerometer (G-forces)
  float accel_x = 10;
  float accel_y = 11;
  float accel_z = 12;

  // Physics: Gyroscope (degrees/sec)
  float gyro_x = 13;
  float gyro_y = 14;
  float gyro_z = 15;

  int64 timestamp = 16;
  int32 batt_pct = 17;
}

message PingBatch {
  repeated Ping pings = 1;
  string device_id = 2;
  int64 batch_timestamp = 3;
}

// Telemetry message envelope (legacy compatibility)
message ClientMessage {
  oneof data {
    Ping ping = 1;
    PingBatch batch = 2;
    GenericMessage generic = 3;
  }
}

message ServerMessage {
  oneof data {
    string status = 1;
    ErrorResponse error = 2;
    GenericMessage message = 3;
  }
}

message GenericMessage {
  string message = 1;
}

message ErrorResponse {
  string error = 1;
  int32 code = 2;
}
