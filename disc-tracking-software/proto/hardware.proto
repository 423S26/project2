syntax = "proto3";

package disctracking;

option go_package = "project2/disc-tracking-software/pb";

// ============ HARDWARE/TELEMETRY MESSAGES ============

message Ping {
  string device_id = 1;
  int64 timestamp = 2;
  float accel_x = 3;
  float accel_y = 4;
  float accel_z = 5;
  float gyro_x = 6;
  float gyro_y = 7;
  float gyro_z = 8;
  optional float mag_x = 9;
  optional float mag_y = 10;
  optional float mag_z = 11;
  optional double latitude = 12;
  optional double longitude = 13;
  optional double altitude = 14;
  optional float hdop = 15;
  optional int32 satellites = 16;
  int32 battery_percent = 17;
  int32 signal_strength = 18;
}

message PingBatch {
  repeated Ping pings = 1;
  string device_id = 2;
  int64 batch_timestamp = 3;
}

// WebSocket message envelope
message ClientMessage {
  oneof data {
    Ping ping = 1;
    PingBatch batch = 2;
    GenericMessage generic = 3;
  }
}

message ServerMessage {
  oneof data {
    string status = 1;
    ErrorResponse error = 2;
    GenericMessage message = 3;
  }
}

message GenericMessage {
  string message = 1;
}

message ErrorResponse {
  string error = 1;
  int32 code = 2;
}
